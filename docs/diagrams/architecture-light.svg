<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc"><title id="title">전체 구조</title><desc id="desc">브라우저의 React 화면에서 WASM 경계를 통해 Rust 엔진을 실행합니다. 엔진은 Heap과 GC를 관리하고 완료 기록을 별도로 복사합니다.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f7faff"/><stop offset="1" stop-color="#f5f2ff"/></linearGradient><pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#245bd6" stroke-opacity=".055"/></pattern></defs><style>text{font-family:'Malgun Gothic','Apple SD Gothic Neo','Segoe UI',sans-serif}</style><rect width="960" height="560" rx="24" fill="url(#bg)"/><rect width="960" height="560" rx="24" fill="url(#grid)"/>
