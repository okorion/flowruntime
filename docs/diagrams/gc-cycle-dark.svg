<svg xmlns="http://www.w3.org/2000/svg" width="960" height="585" viewBox="0 0 960 585" role="img" aria-labelledby="title desc"><title id="title">GC 회수 과정</title><desc id="desc">Root가 연결된 객체를 남깁니다. 보존 기간이 끝나고 다른 Root가 없으면 연결이 끊깁니다. GC는 Root에서 도달할 수 없는 객체를 회수합니다. Pin은 Root를 유지합니다.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101927"/><stop offset="1" stop-color="#191a32"/></linearGradient><pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#91b6ff" stroke-opacity=".055"/></pattern></defs><style>text{font-family:'Malgun Gothic','Apple SD Gothic Neo','Segoe UI',sans-serif}</style><rect width="960" height="585" rx="24" fill="url(#bg)"/><rect width="960" height="585" rx="24" fill="url(#grid)"/>
<text x="28" y="40" font-size="17" fill="#91b6ff" font-weight="750" text-anchor="start">FLOWRUNTIME  /  03</text>
<text x="28" y="85" font-size="34" fill="#eef4ff" font-weight="800" text-anchor="start">남길 기준은 Root와의 연결</text>
<text x="28" y="121" font-size="21" fill="#b5c5dd" font-weight="500" text-anchor="start">Root = 아직 필요한 객체를 찾는 시작점</text>
<rect x="28" y="167" width="284" height="200" rx="18" fill="#1b293b" stroke="#465977"/>
<text x="48" y="201" font-size="24" fill="#83dbb3" font-weight="750" text-anchor="start">① 연결됨</text>
<rect x="48" y="225" width="74" height="37" rx="10" fill="#233349" stroke="#465977"/>
<text x="85" y="251" font-size="20" fill="#eef4ff" font-weight="650" text-anchor="middle">Root</text>
<path d="M132 243 L284 243" fill="none" stroke="#83dbb3" stroke-width="2.5" />
<path d="M275.22417438109625 247.79425538604204 L284 243 L275.22417438109625 238.20574461395796" fill="none" stroke="#83dbb3" stroke-width="2.5"/>
<rect x="48" y="282" width="100" height="44" rx="10" fill="#233349" stroke="#465977"/>
<text x="98" y="311" font-size="21" fill="#91b6ff" font-weight="750" text-anchor="middle">Run</text>
<rect x="192" y="282" width="100" height="44" rx="10" fill="#233349" stroke="#465977"/>
<text x="242" y="311" font-size="21" fill="#73dae4" font-weight="750" text-anchor="middle">Task</text>
<text x="170" y="312" font-size="24" fill="#b5c5dd" font-weight="600" text-anchor="middle">⇄</text>
<path d="M284 243 V270 H98 V278" fill="none" stroke="#83dbb3" stroke-width="2" />
<text x="48" y="354" font-size="18" fill="#b5c5dd" font-weight="500" text-anchor="start">실행 중 / 보존 기간 / Pin</text>
<rect x="338" y="167" width="284" height="200" rx="18" fill="#1b293b" stroke="#465977"/>
<text x="358" y="201" font-size="24" fill="#ffbf87" font-weight="750" text-anchor="start">② 연결 끊김</text>
<rect x="358" y="225" width="74" height="37" rx="10" fill="#233349" stroke="#465977"/>
<text x="395" y="251" font-size="20" fill="#eef4ff" font-weight="650" text-anchor="middle">Root</text>
<path d="M442 243 L594 243" fill="none" stroke="#ffbf87" stroke-width="2.5" stroke-dasharray="6 6"/>
<path d="M585.2241743810963 247.79425538604204 L594 243 L585.2241743810963 238.20574461395796" fill="none" stroke="#ffbf87" stroke-width="2.5"/>
<text x="498" y="251" font-size="28" fill="#ffbf87" font-weight="800" text-anchor="start">×</text>
<rect x="358" y="282" width="100" height="44" rx="10" fill="#233349" stroke="#465977"/>
<text x="408" y="311" font-size="21" fill="#91b6ff" font-weight="750" text-anchor="middle">Run</text>
<rect x="502" y="282" width="100" height="44" rx="10" fill="#233349" stroke="#465977"/>
<text x="552" y="311" font-size="21" fill="#73dae4" font-weight="750" text-anchor="middle">Task</text>
<text x="480" y="312" font-size="24" fill="#b5c5dd" font-weight="600" text-anchor="middle">⇄</text>
<path d="M594 243 V270 H408 V278" fill="none" stroke="#ffbf87" stroke-width="2" stroke-dasharray="6 6"/>
<text x="358" y="354" font-size="18" fill="#b5c5dd" font-weight="500" text-anchor="start">완료 후 5초 · Pin 없음</text>
<rect x="648" y="167" width="284" height="200" rx="18" fill="#1b293b" stroke="#465977"/>
<text x="668" y="201" font-size="24" fill="#c7a7ff" font-weight="750" text-anchor="start">③ GC 실행</text>
<text x="668" y="256" font-size="24" fill="#c7a7ff" font-weight="750" text-anchor="start">Run · Task 회수</text>
<text x="668" y="293" font-size="20" fill="#b5c5dd" font-weight="500" text-anchor="start">서로 참조해도 회수 가능</text>
<text x="668" y="336" font-size="18" fill="#b5c5dd" font-weight="500" text-anchor="start">빈 슬롯 → 다음 실행에 재사용</text>
<path d="M318 270 L330 270" fill="none" stroke="#91b6ff" stroke-width="2.5" />
<path d="M321.22417438109625 274.79425538604204 L330 270 L321.22417438109625 265.20574461395796" fill="none" stroke="#91b6ff" stroke-width="2.5"/>
<path d="M628 270 L640 270" fill="none" stroke="#91b6ff" stroke-width="2.5" />
<path d="M631.2241743810963 274.79425538604204 L640 270 L631.2241743810963 265.20574461395796" fill="none" stroke="#91b6ff" stroke-width="2.5"/>
<rect x="28" y="411" width="904" height="134" rx="18" fill="#1b293b" stroke="#465977"/>
<rect x="28" y="429" width="4" height="98" rx="2" fill="#83dbb3"/>
<text x="48" y="446" font-size="24" fill="#83dbb3" font-weight="750" text-anchor="start">직접 확인하기</text>
<text x="48" y="479" font-size="20" fill="#b5c5dd" font-weight="500" text-anchor="start">자동 GC 끄기 → 주문 분류 실행 → 가상 시간 +5초 두 번 → GC 실행</text>
<text x="48" y="506" font-size="20" fill="#b5c5dd" font-weight="500" text-anchor="start">Pin을 켜고 반복하면 보존됩니다. 해제 후 GC로 차이를 확인하세요.</text>
</svg>
