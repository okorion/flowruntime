<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc"><title id="title">실행할 때 생기는 객체</title><desc id="desc">Run은 실행 한 번, Task는 노드 처리, Value는 입출력 데이터, Continuation은 다음 작업을 이어 갈 정보입니다. Run과 Task는 서로 참조합니다.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f7faff"/><stop offset="1" stop-color="#f5f2ff"/></linearGradient><pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#245bd6" stroke-opacity=".055"/></pattern></defs><style>text{font-family:'Malgun Gothic','Apple SD Gothic Neo','Segoe UI',sans-serif}</style><rect width="960" height="560" rx="24" fill="url(#bg)"/><rect width="960" height="560" rx="24" fill="url(#grid)"/>
<text x="28" y="40" font-size="17" fill="#245bd6" font-weight="750" text-anchor="start">FLOWRUNTIME  /  02</text>
<text x="28" y="85" font-size="34" fill="#17243b" font-weight="800" text-anchor="start">실행 한 번, 객체 네 종류</text>
<text x="28" y="121" font-size="21" fill="#4e607a" font-weight="500" text-anchor="start">Heap은 실행에 필요한 객체의 저장소</text>
<rect x="28" y="158" width="438" height="124" rx="18" fill="#ffffff" stroke="#cbd7e8"/>
<rect x="28" y="176" width="4" height="88" rx="2" fill="#245bd6"/>
<text x="48" y="193" font-size="24" fill="#245bd6" font-weight="750" text-anchor="start">Run</text>
<text x="48" y="226" font-size="20" fill="#4e607a" font-weight="500" text-anchor="start">실행 한 번</text>
<text x="48" y="253" font-size="20" fill="#4e607a" font-weight="500" text-anchor="start">Task 목록과 최종 결과</text>
<rect x="494" y="158" width="438" height="124" rx="18" fill="#ffffff" stroke="#cbd7e8"/>
<rect x="494" y="176" width="4" height="88" rx="2" fill="#087f8c"/>
<text x="514" y="193" font-size="24" fill="#087f8c" font-weight="750" text-anchor="start">Task</text>
<text x="514" y="226" font-size="20" fill="#4e607a" font-weight="500" text-anchor="start">노드 하나의 처리</text>
<text x="514" y="253" font-size="20" fill="#4e607a" font-weight="500" text-anchor="start">어느 Run인지 / 입출력</text>
<rect x="28" y="328" width="438" height="124" rx="18" fill="#ffffff" stroke="#cbd7e8"/>
<rect x="28" y="346" width="4" height="88" rx="2" fill="#7341be"/>
<text x="48" y="363" font-size="24" fill="#7341be" font-weight="750" text-anchor="start">Value</text>
<text x="48" y="396" font-size="20" fill="#4e607a" font-weight="500" text-anchor="start">입력·출력 데이터</text>
<text x="48" y="423" font-size="20" fill="#4e607a" font-weight="500" text-anchor="start">JSON 값을 보관</text>
<rect x="494" y="328" width="438" height="124" rx="18" fill="#ffffff" stroke="#cbd7e8"/>
<rect x="494" y="346" width="4" height="88" rx="2" fill="#a45114"/>
<text x="514" y="363" font-size="24" fill="#a45114" font-weight="750" text-anchor="start">Continuation</text>
<text x="514" y="396" font-size="20" fill="#4e607a" font-weight="500" text-anchor="start">다음 작업을 이어 갈 정보</text>
<text x="514" y="423" font-size="20" fill="#4e607a" font-weight="500" text-anchor="start">재개할 Run / Task / 값</text>
<rect x="28" y="510" width="904" height="34" rx="12" fill="#edf3fb" stroke="#edf3fb"/>
<text x="480" y="534" font-size="21" fill="#17243b" font-weight="650" text-anchor="middle">Run ⇄ Task : 서로 참조해도 Root가 끊기면 회수할 수 있습니다.</text>
