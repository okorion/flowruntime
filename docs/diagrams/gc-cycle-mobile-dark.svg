<text x="28" y="858" font-size="18" fill="#83dbb3" font-weight="650" text-anchor="start">Pin을 켜면 ① 유지 · 해제하면 회수 가능</text>
<text x="28" y="890" font-size="16" fill="#b5c5dd" font-weight="500" text-anchor="start">조건: 완료 + 보존 기간 만료 + 다른 Root 없음</text>
