<text x="48" y="341" font-size="18" fill="#b5c5dd" font-weight="500" text-anchor="start">실행 중 / 보존 기간 / Pin</text>
<rect x="28" y="382" width="364" height="200" rx="18" fill="#1b293b" stroke="#465977"/>
<text x="48" y="416" font-size="24" fill="#ffbf87" font-weight="750" text-anchor="start">② 연결 끊김</text>
