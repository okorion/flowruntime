<svg xmlns="http://www.w3.org/2000/svg" width="420" height="920" viewBox="0 0 420 920" role="img" aria-labelledby="title desc"><title id="title">GC 회수 과정</title><desc id="desc">Root가 연결된 객체를 남깁니다. 보존 기간이 끝나고 다른 Root가 없으면 연결이 끊깁니다. GC는 Root에서 도달할 수 없는 객체를 회수합니다. Pin은 Root를 유지합니다.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101927"/><stop offset="1" stop-color="#191a32"/></linearGradient><pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#91b6ff" stroke-opacity=".055"/></pattern></defs><style>text{font-family:'Malgun Gothic','Apple SD Gothic Neo','Segoe UI',sans-serif}</style><rect width="420" height="920" rx="24" fill="url(#bg)"/><rect width="420" height="920" rx="24" fill="url(#grid)"/>
<text x="28" y="40" font-size="17" fill="#91b6ff" font-weight="750" text-anchor="start">FLOWRUNTIME  /  03</text>
<text x="28" y="85" font-size="28" fill="#eef4ff" font-weight="800" text-anchor="start">남길 기준은 Root와의 연결</text>
<text x="28" y="121" font-size="18" fill="#b5c5dd" font-weight="500" text-anchor="start">Root = 아직 필요한 객체를 찾는 시작점</text>
