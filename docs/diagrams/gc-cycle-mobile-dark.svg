<text x="48" y="644" font-size="24" fill="#c7a7ff" font-weight="750" text-anchor="start">③ GC 실행</text>
<text x="48" y="699" font-size="24" fill="#c7a7ff" font-weight="750" text-anchor="start">Run · Task 회수</text>
<text x="48" y="736" font-size="20" fill="#b5c5dd" font-weight="500" text-anchor="start">서로 참조해도 회수 가능</text>
<text x="48" y="779" font-size="18" fill="#b5c5dd" font-weight="500" text-anchor="start">빈 슬롯 → 다음 실행에 재사용</text>
