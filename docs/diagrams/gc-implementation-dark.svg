<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img" aria-labelledby="title desc"><title id="title">GC 구현과 슬롯 재사용</title><desc id="desc">Root를 모으고, 참조를 따라 Mark한 뒤, 표시되지 않은 객체를 Sweep합니다. 예시 슬롯 7의 Generation은 1에서 2로 바뀌며 예전 Handle 7:1은 거부됩니다.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101927"/><stop offset="1" stop-color="#191a32"/></linearGradient><pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#91b6ff" stroke-opacity=".055"/></pattern></defs><style>text{font-family:'Malgun Gothic','Apple SD Gothic Neo','Segoe UI',sans-serif}</style><rect width="960" height="640" rx="24" fill="url(#bg)"/><rect width="960" height="640" rx="24" fill="url(#grid)"/>
<text x="28" y="40" font-size="17" fill="#91b6ff" font-weight="750" text-anchor="start">FLOWRUNTIME  /  04</text>
<text x="28" y="85" font-size="34" fill="#eef4ff" font-weight="800" text-anchor="start">코드는 이 순서로 읽기</text>
<text x="28" y="121" font-size="21" fill="#b5c5dd" font-weight="500" text-anchor="start">찾기 → 표시 → 회수 → 재사용</text>
<rect x="28" y="160" width="284" height="122" rx="18" fill="#1b293b" stroke="#465977"/>
<rect x="28" y="178" width="4" height="86" rx="2" fill="#91b6ff"/>
<text x="48" y="195" font-size="24" fill="#91b6ff" font-weight="750" text-anchor="start">1 · Root 수집</text>
<text x="48" y="228" font-size="20" fill="#b5c5dd" font-weight="500" text-anchor="start">남겨야 할 시작점</text>
<text x="48" y="255" font-size="20" fill="#b5c5dd" font-weight="500" text-anchor="start">diagnostics.rs · root_map()</text>
<rect x="338" y="160" width="284" height="122" rx="18" fill="#1b293b" stroke="#465977"/>
<rect x="338" y="178" width="4" height="86" rx="2" fill="#73dae4"/>
<text x="358" y="195" font-size="24" fill="#73dae4" font-weight="750" text-anchor="start">2 · Mark</text>
<text x="358" y="228" font-size="20" fill="#b5c5dd" font-weight="500" text-anchor="start">참조를 따라 생존 표시</text>
<text x="358" y="255" font-size="20" fill="#b5c5dd" font-weight="500" text-anchor="start">gc.rs · collect()</text>
<rect x="648" y="160" width="284" height="122" rx="18" fill="#1b293b" stroke="#465977"/>
<rect x="648" y="178" width="4" height="86" rx="2" fill="#c7a7ff"/>
<text x="668" y="195" font-size="24" fill="#c7a7ff" font-weight="750" text-anchor="start">3 · Sweep</text>
<text x="668" y="228" font-size="20" fill="#b5c5dd" font-weight="500" text-anchor="start">표시 안 된 객체 회수</text>
<text x="668" y="255" font-size="20" fill="#b5c5dd" font-weight="500" text-anchor="start">gc.rs → heap.rs</text>
<text x="28" y="355" font-size="26" fill="#eef4ff" font-weight="750" text-anchor="start">슬롯은 재사용하고, 세대는 바꿉니다.</text>
<rect x="28" y="390" width="390" height="112" rx="18" fill="#1b293b" stroke="#465977"/>
<rect x="28" y="408" width="4" height="76" rx="2" fill="#ffbf87"/>
<text x="48" y="425" font-size="24" fill="#ffbf87" font-weight="750" text-anchor="start">예시 · 슬롯 7 / 세대 1</text>
<text x="48" y="458" font-size="20" fill="#b5c5dd" font-weight="500" text-anchor="start">기존 객체 · Handle 7:1</text>
<path d="M428 446 L520 446" fill="none" stroke="#c7a7ff" stroke-width="2.5" />
<path d="M511.22417438109625 450.79425538604204 L520 446 L511.22417438109625 441.20574461395796" fill="none" stroke="#c7a7ff" stroke-width="2.5"/>
<text x="475" y="423" font-size="18" fill="#b5c5dd" font-weight="650" text-anchor="middle">회수</text>
<rect x="534" y="390" width="398" height="112" rx="18" fill="#1b293b" stroke="#465977"/>
<rect x="534" y="408" width="4" height="76" rx="2" fill="#83dbb3"/>
<text x="554" y="425" font-size="24" fill="#83dbb3" font-weight="750" text-anchor="start">회수 후 · 슬롯 7 / 세대 2</text>
<text x="554" y="458" font-size="20" fill="#b5c5dd" font-weight="500" text-anchor="start">새 객체 · Handle 7:2</text>
<text x="28" y="550" font-size="23" fill="#ffbf87" font-weight="650" text-anchor="start">이전 7:1 조회 → 세대 불일치로 거부합니다.</text>
<text x="28" y="592" font-size="21" fill="#b5c5dd" font-weight="500" text-anchor="start">빈 슬롯이 늘어도 WASM 메모리 크기는 그대로일 수 있습니다.</text>
</svg>
