<text x="26" y="109" font-size="14" fill="#a7b7cf" font-weight="500" text-anchor="start" letter-spacing="0">Root에서 닿는 객체는 남기고,</text>
<text x="26" y="134" font-size="14" fill="#a7b7cf" font-weight="500" text-anchor="start" letter-spacing="0">닿지 않는 객체는 회수합니다.</text>
