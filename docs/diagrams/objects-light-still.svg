<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="410" viewBox="0 0 1200 410" role="img" aria-labelledby="title desc"><title id="title">런타임 객체의 참조</title><desc id="desc">Run은 실행 한 번, Task는 노드 처리, Value는 JSON 값, Continuation은 다음 작업을 이어 갈 정보입니다. 주요 참조만 표시합니다.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#f4f1ff"/></linearGradient><linearGradient id="accent"><stop stop-color="#2563eb"/><stop offset=".5" stop-color="#008da5"/><stop offset="1" stop-color="#7c3aed"/></linearGradient><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#2563eb" stroke-opacity=".035"/></pattern><filter id="shadow" x="-20%" y="-30%" width="140%" height="170%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#34558c" flood-opacity=".07"/></filter></defs><style>text{font-family:'Segoe UI','Malgun Gothic','Apple SD Gothic Neo',sans-serif}.flow{animation:none}.pulse{animation:none}@keyframes flow{to{stroke-dashoffset:-18}}@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}@media(prefers-reduced-motion:reduce){.flow,.pulse{animation:none}}</style><rect width="1200" height="410" rx="24" fill="url(#bg)"/><rect width="1200" height="410" rx="24" fill="url(#grid)"/>
<text x="44" y="55" font-size="10" fill="#2563eb" font-weight="800" text-anchor="start" letter-spacing="1.7">FLOWRUNTIME / 02 / RUNTIME OBJECTS</text>
<text x="44" y="126" font-size="32" fill="#17243b" font-weight="800" text-anchor="start" letter-spacing="-0.8">실행을 잇는 객체</text>
<rect x="44" y="144" width="166" height="3" rx="1.5" fill="url(#accent)"/>
<text x="44" y="182" font-size="15" fill="#63748c" font-weight="500" text-anchor="start" letter-spacing="0">Run은 Task를 알고,</text>
<text x="44" y="207" font-size="15" fill="#63748c" font-weight="500" text-anchor="start" letter-spacing="0">Task도 자신의 Run을 참조합니다.</text>
<rect x="44" y="304" width="145.5" height="26" rx="13" fill="#fff" stroke="#dce5f2"/>
<circle cx="56" cy="317" r="3" fill="#7c3aed"/>
