<text x="782" y="287" font-size="11" fill="#63748c" font-weight="500" text-anchor="middle" letter-spacing="0">캡처한 값</text>
<text x="434" y="386" font-size="12" fill="#63748c" font-weight="500" text-anchor="start" letter-spacing="0">주요 참조만 표시 · Workflow 실행 순서와 객체 참조는 다릅니다.</text>
