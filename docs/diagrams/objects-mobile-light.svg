<svg xmlns="http://www.w3.org/2000/svg" width="420" height="620" viewBox="0 0 420 620" role="img" aria-labelledby="title desc"><title id="title">런타임 객체의 참조</title><desc id="desc">Run은 실행 한 번, Task는 노드 처리, Value는 JSON 값, Continuation은 다음 작업을 이어 갈 정보입니다. 주요 참조만 표시합니다.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#f4f1ff"/></linearGradient><linearGradient id="accent"><stop stop-color="#2563eb"/><stop offset=".5" stop-color="#008da5"/><stop offset="1" stop-color="#7c3aed"/></linearGradient><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#2563eb" stroke-opacity=".035"/></pattern><filter id="shadow" x="-20%" y="-30%" width="140%" height="170%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#34558c" flood-opacity=".07"/></filter></defs><style>text{font-family:'Segoe UI','Malgun Gothic','Apple SD Gothic Neo',sans-serif}.flow{animation:flow 1.8s linear infinite}.pulse{animation:pulse 3s ease-in-out infinite}@keyframes flow{to{stroke-dashoffset:-18}}@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}@media(prefers-reduced-motion:reduce){.flow,.pulse{animation:none}}</style><rect width="420" height="620" rx="24" fill="url(#bg)"/><rect width="420" height="620" rx="24" fill="url(#grid)"/>
<text x="26" y="32" font-size="10" fill="#2563eb" font-weight="800" text-anchor="start" letter-spacing="1.7">FLOWRUNTIME / 02 / RUNTIME OBJECTS</text>
<text x="26" y="69" font-size="25" fill="#17243b" font-weight="800" text-anchor="start" letter-spacing="-0.8">실행을 잇는 객체</text>
<rect x="26" y="81" width="96" height="3" rx="1.5" fill="url(#accent)"/>
<text x="26" y="109" font-size="14" fill="#63748c" font-weight="500" text-anchor="start" letter-spacing="0">Run은 Task를 알고,</text>
<text x="26" y="134" font-size="14" fill="#63748c" font-weight="500" text-anchor="start" letter-spacing="0">Task도 자신의 Run을 참조합니다.</text>
<rect x="26" y="169" width="368" height="80" rx="14" fill="#fff" stroke="#dce5f2" filter="url(#shadow)"/>
<circle cx="44" cy="190" r="3" fill="#2563eb"/>
<text x="56" y="195" font-size="17" fill="#2563eb" font-weight="750" text-anchor="start" letter-spacing="0">Run</text>
<text x="44" y="222" font-size="13" fill="#63748c" font-weight="500" text-anchor="start" letter-spacing="0">실행 한 번 · Task 목록과 결과</text>
<rect x="26" y="268" width="368" height="80" rx="14" fill="#fff" stroke="#dce5f2" filter="url(#shadow)"/>
<circle cx="44" cy="289" r="3" fill="#008da5"/>
<text x="56" y="294" font-size="17" fill="#008da5" font-weight="750" text-anchor="start" letter-spacing="0">Task</text>
<text x="44" y="321" font-size="13" fill="#63748c" font-weight="500" text-anchor="start" letter-spacing="0">노드 하나의 처리 · 소속 Run과 입출력</text>
<rect x="26" y="367" width="368" height="80" rx="14" fill="#fff" stroke="#dce5f2" filter="url(#shadow)"/>
<circle cx="44" cy="388" r="3" fill="#7c3aed"/>
<text x="56" y="393" font-size="17" fill="#7c3aed" font-weight="750" text-anchor="start" letter-spacing="0">Value</text>
<text x="44" y="420" font-size="13" fill="#63748c" font-weight="500" text-anchor="start" letter-spacing="0">입력·출력 JSON 데이터</text>
<rect x="26" y="466" width="368" height="80" rx="14" fill="#fff" stroke="#dce5f2" filter="url(#shadow)"/>
<circle cx="44" cy="487" r="3" fill="#b56e12"/>
<text x="56" y="492" font-size="17" fill="#b56e12" font-weight="750" text-anchor="start" letter-spacing="0">Continuation</text>
<text x="44" y="519" font-size="13" fill="#63748c" font-weight="500" text-anchor="start" letter-spacing="0">다음 작업을 이어 갈 Run / Task / 값</text>
<text x="26" y="594" font-size="13" fill="#63748c" font-weight="500" text-anchor="start" letter-spacing="0">Run ⇄ Task : Root가 끊기면 함께 회수</text>
</svg>
