<svg xmlns="http://www.w3.org/2000/svg" width="420" height="697" viewBox="0 0 420 697" role="img" aria-labelledby="title desc"><title id="title">Mark Sweep과 Generation</title><desc id="desc">Root 수집, Mark, Sweep 후 슬롯을 재사용합니다. 슬롯 7의 세대 1이 2로 증가하므로 예전 Handle 7:1은 거부됩니다.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101a2c"/><stop offset="1" stop-color="#201d38"/></linearGradient><linearGradient id="accent"><stop stop-color="#82acff"/><stop offset=".5" stop-color="#5ed3e2"/><stop offset="1" stop-color="#ba99ff"/></linearGradient><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#82acff" stroke-opacity=".035"/></pattern><filter id="shadow" x="-20%" y="-30%" width="140%" height="170%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#000" flood-opacity=".07"/></filter></defs><style>text{font-family:'Segoe UI','Malgun Gothic','Apple SD Gothic Neo',sans-serif}.flow{animation:none}.pulse{animation:none}@keyframes flow{to{stroke-dashoffset:-18}}@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}@media(prefers-reduced-motion:reduce){.flow,.pulse{animation:none}}</style><rect width="420" height="697" rx="24" fill="url(#bg)"/><rect width="420" height="697" rx="24" fill="url(#grid)"/>
<text x="26" y="32" font-size="10" fill="#82acff" font-weight="800" text-anchor="start" letter-spacing="1.7">FLOWRUNTIME / 04 / IMPLEMENTATION</text>
<text x="26" y="69" font-size="25" fill="#f0f5ff" font-weight="800" text-anchor="start" letter-spacing="-0.8">찾고, 표시하고, 회수</text>
<rect x="26" y="81" width="96" height="3" rx="1.5" fill="url(#accent)"/>
<text x="26" y="109" font-size="14" fill="#a7b7cf" font-weight="500" text-anchor="start" letter-spacing="0">슬롯은 다시 사용합니다.</text>
<text x="26" y="134" font-size="14" fill="#a7b7cf" font-weight="500" text-anchor="start" letter-spacing="0">Generation으로 이전 참조를 구분합니다.</text>
<rect x="26" y="171" width="368" height="78" rx="14" fill="#1a273d" stroke="#354662" filter="url(#shadow)"/>
<circle cx="44" cy="192" r="3" fill="#82acff"/>
<text x="56" y="197" font-size="17" fill="#82acff" font-weight="750" text-anchor="start" letter-spacing="0">Root</text>
<text x="44" y="224" font-size="13" fill="#a7b7cf" font-weight="500" text-anchor="start" letter-spacing="0">보존할 시작점 · root_map()</text>
<rect x="26" y="268" width="368" height="78" rx="14" fill="#1a273d" stroke="#354662" filter="url(#shadow)"/>
<circle cx="44" cy="289" r="3" fill="#5ed3e2"/>
<text x="56" y="294" font-size="17" fill="#5ed3e2" font-weight="750" text-anchor="start" letter-spacing="0">Mark</text>
<text x="44" y="321" font-size="13" fill="#a7b7cf" font-weight="500" text-anchor="start" letter-spacing="0">참조를 따라 표시 · collect()</text>
<rect x="26" y="365" width="368" height="78" rx="14" fill="#1a273d" stroke="#354662" filter="url(#shadow)"/>
<circle cx="44" cy="386" r="3" fill="#ba99ff"/>
<text x="56" y="391" font-size="17" fill="#ba99ff" font-weight="750" text-anchor="start" letter-spacing="0">Sweep</text>
<text x="44" y="418" font-size="13" fill="#a7b7cf" font-weight="500" text-anchor="start" letter-spacing="0">표시 안 된 객체 회수 · release()</text>
<text x="26" y="493" font-size="13" fill="#a7b7cf" font-weight="650" text-anchor="start" letter-spacing="0">슬롯 7 · Generation 예시</text>
<rect x="26" y="511" width="164" height="83" rx="14" fill="#1a273d" stroke="#354662" filter="url(#shadow)"/>
<circle cx="44" cy="532" r="3" fill="#eab975"/>
<text x="56" y="537" font-size="17" fill="#eab975" font-weight="750" text-anchor="start" letter-spacing="0">7:1</text>
<text x="44" y="564" font-size="13" fill="#a7b7cf" font-weight="500" text-anchor="start" letter-spacing="0">기존 객체</text>
<rect x="230" y="511" width="164" height="83" rx="14" fill="#1a273d" stroke="#354662" filter="url(#shadow)"/>
<circle cx="248" cy="532" r="3" fill="#65d6b0"/>
<text x="260" y="537" font-size="17" fill="#65d6b0" font-weight="750" text-anchor="start" letter-spacing="0">7:2</text>
<text x="248" y="564" font-size="13" fill="#a7b7cf" font-weight="500" text-anchor="start" letter-spacing="0">새 객체</text>
<path d="M197 552 L223 552" fill="none" stroke="#ba99ff" stroke-opacity=".18" stroke-width="1.5"/><path d="M197 552 L223 552" fill="none" stroke="#ba99ff" stroke-width="1.5" stroke-dasharray="3 6" class="flow"/>
<path d="M217.88485286764296 555.1361233735839 L223 552 L217.88485286764296 548.8638766264161" fill="none" stroke="#ba99ff" stroke-width="1.5"/>
<text x="26" y="627" font-size="13" fill="#a7b7cf" font-weight="500" text-anchor="start" letter-spacing="0">회수 → 세대 증가 → 슬롯 재사용</text>
<text x="26" y="658" font-size="12" fill="#eab975" font-weight="500" text-anchor="start" letter-spacing="0">이전 Handle 7:1은 세대 불일치로 거부</text>
</svg>
