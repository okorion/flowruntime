<text x="44" y="219" font-size="13" fill="#63748c" font-weight="500" text-anchor="start" letter-spacing="0">Workflow 편집 / 결과 / 개발자 도구</text>
<path d="M210 252 L210 280" fill="none" stroke="#2563eb" stroke-opacity=".18" stroke-width="1.5"/><path d="M210 252 L210 280" fill="none" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="3 6" class="flow"/>
<path d="M206.86387662641604 274.88485286764296 L210 280 L213.13612337358396 274.88485286764296" fill="none" stroke="#2563eb" stroke-width="1.5"/>
<text x="226" y="271" font-size="11" fill="#63748c" font-weight="500" text-anchor="start" letter-spacing="0">JSON · wasm-bindgen</text>
<rect x="26" y="288" width="368" height="82" rx="14" fill="#fff" stroke="#dce5f2" filter="url(#shadow)"/>
<circle cx="44" cy="309" r="3" fill="#008da5"/>
<text x="56" y="314" font-size="17" fill="#008da5" font-weight="750" text-anchor="start" letter-spacing="0">Rust · WASM</text>
<text x="44" y="341" font-size="13" fill="#63748c" font-weight="500" text-anchor="start" letter-spacing="0">정의 검증 / 노드 실행 / 가상 시간</text>
<path d="M210 374 L210 402" fill="none" stroke="#008da5" stroke-opacity=".18" stroke-width="1.5"/><path d="M210 374 L210 402" fill="none" stroke="#008da5" stroke-width="1.5" stroke-dasharray="3 6" class="flow"/>
