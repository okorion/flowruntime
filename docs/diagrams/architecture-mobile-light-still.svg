<svg xmlns="http://www.w3.org/2000/svg" width="420" height="650" viewBox="0 0 420 650" role="img" aria-labelledby="title desc"><title id="title">FlowRuntime 아키텍처</title><desc id="desc">React의 JSON 명령을 WASM으로 전달합니다. Rust 엔진이 객체와 GC를 관리하고 완료 기록을 별도 복사합니다.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#f4f1ff"/></linearGradient><linearGradient id="accent"><stop stop-color="#2563eb"/><stop offset=".5" stop-color="#008da5"/><stop offset="1" stop-color="#7c3aed"/></linearGradient><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#2563eb" stroke-opacity=".035"/></pattern><filter id="shadow" x="-20%" y="-30%" width="140%" height="170%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#34558c" flood-opacity=".07"/></filter></defs><style>text{font-family:'Segoe UI','Malgun Gothic','Apple SD Gothic Neo',sans-serif}.flow{animation:none}.pulse{animation:none}@keyframes flow{to{stroke-dashoffset:-18}}@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}@media(prefers-reduced-motion:reduce){.flow,.pulse{animation:none}}</style><rect width="420" height="650" rx="24" fill="url(#bg)"/><rect width="420" height="650" rx="24" fill="url(#grid)"/>
<text x="26" y="32" font-size="10" fill="#2563eb" font-weight="800" text-anchor="start" letter-spacing="1.7">FLOWRUNTIME / 01 / ARCHITECTURE</text>
<text x="26" y="69" font-size="25" fill="#17243b" font-weight="800" text-anchor="start" letter-spacing="-0.8">FlowRuntime</text>
<rect x="26" y="81" width="96" height="3" rx="1.5" fill="url(#accent)"/>
<text x="26" y="109" font-size="14" fill="#63748c" font-weight="500" text-anchor="start" letter-spacing="0">화면에서 실행하고,</text>
<text x="26" y="134" font-size="14" fill="#63748c" font-weight="500" text-anchor="start" letter-spacing="0">Rust/WASM에서 객체를 관리합니다.</text>
